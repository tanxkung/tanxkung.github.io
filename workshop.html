<script type="application/json" id="sourceData">[{"page": 1, "title": "把每一天\n過得更好", "text": ["把每一天\n過得更好", "好習慣・喜歡生活・遇到困難不孤單", "一起看影片・聊生活"], "notes": "時間：0–5 分鐘。\n開場可以說：今天不是考試，也沒有標準答案。我們一起看幾支有趣的影片，聊聊生活中會遇到的事情。\n稱呼以「大家」「各位朋友」為主；一次只問一個問題。", "links": []}, {"page": 2, "title": "今天，我們一起做三件事", "text": ["2", "今天，我們一起做三件事", "照顧自己\n每天把一件小事做好", "喜歡生活\n發現讓自己開心的事", "面對困難\n再試、換方法、找人幫忙"], "notes": "時間：5–10 分鐘。\n逐一指著三個主題說明，不需要解釋「自律」等抽象名詞。\n邀請大家用舉手回答：今天有刷牙的請舉手；今天有跟別人說早安的請舉手。", "links": []}, {"page": 3, "title": "先來看一個有趣的誤會", "text": ["3", "先來看一個有趣的誤會", "影片｜Snack Attack", "看完後猜猜看：\n到底是誰吃了誰的餅乾？", "▶  點這裡播放影片"], "notes": "時間：10–15 分鐘，影片約 4–5 分鐘。\n播放前只問一題：等一下請大家幫忙找出，餅乾到底是誰的？\n若現場網路不穩，可直接口述故事：阿姨以為旁邊的人吃了她的餅乾，最後才發現自己的餅乾仍在包包裡。\n\n[Sources]\nhttps://www.youtube.com/watch?v=38y_1EWIE9I\nhttps://i.ytimg.com/vi/38y_1EWIE9I/hqdefault.jpg\n[/Sources]", "links": ["https://i.ytimg.com/vi/38y_1EWIE9I/hqdefault.jpg", "https://www.youtube.com/watch?v=38y_1EWIE9I"]}, {"page": 4, "title": "我們看見的，不一定就是全部", "text": ["4", "我們看見的，不一定就是全部", "發生什麼事？", "先說說你看到誰。", "她的心情？", "開心、生氣，還是困惑？", "誰的餅乾？", "一起回想最後的畫面。", "不確定時？", "先停一下，再問清楚。"], "notes": "時間：15–25 分鐘。\n不要一開始就公布答案，讓大家用指圖、舉手或一個詞回答。\n收尾：我們有時候會看錯、想錯，先問清楚，可以少一點生氣。\n\n[Sources]\nhttps://www.youtube.com/watch?v=38y_1EWIE9I\n[/Sources]", "links": ["https://www.youtube.com/watch?v=38y_1EWIE9I"]}, {"page": 5, "title": "好習慣，讓我們每天進步", "text": ["5", "好習慣，讓我們每天進步", "影片｜Pip", "Pip 不是一開始就會。\n牠每天練習，也願意再試一次。", "▶  點這裡播放影片"], "notes": "時間：25–30 分鐘，影片約 4 分鐘。\n播放前問：Pip 想做什麼工作？牠會不會一開始就成功？\n播放後先肯定觀察，不急著講道理。\n\n[Sources]\nhttps://www.youtube.com/watch?v=07d2dXHYb94\nhttps://i.ytimg.com/vi/07d2dXHYb94/hqdefault.jpg\n[/Sources]", "links": ["https://i.ytimg.com/vi/07d2dXHYb94/hqdefault.jpg", "https://www.youtube.com/watch?v=07d2dXHYb94"]}, {"page": 6, "title": "今天，你已經做到哪些好習慣？", "text": ["6", "今天，你已經做到哪些好習慣？", "刷牙洗臉", "讓身體舒服，也更有精神。", "工作前準備", "先把今天要用的東西放好。", "吃完會收拾", "照顧環境，也方便下一個人。", "按時休息", "累了休息，才有力氣再開始。"], "notes": "時間：30–55 分鐘，可搭配動作與舉手遊戲。\n每說一個習慣，就請做得到的人舉手；想試試看的人也可以舉手。\n避免問誰沒有做到，也不要比較快慢。\n可再追加：喝水、收好個人物品、不會時願意問人。\n\n[Sources]\nhttps://www.youtube.com/watch?v=07d2dXHYb94\n[/Sources]", "links": ["https://www.youtube.com/watch?v=07d2dXHYb94"]}, {"page": 7, "title": "休息一下", "text": ["休息一下", "喝水・伸展・上廁所\n十分鐘後再回來", "休息時間"], "notes": "時間：55–65 分鐘。\n明確說出回來時間；休息結束前 2 分鐘提醒一次。", "links": []}, {"page": 8, "title": "幫助別人，也讓自己更快樂", "text": ["8", "幫助別人，也讓自己更快樂", "影片｜Mr. Indifferent", "一個小小的幫忙，\n會讓生活有什麼改變？", "▶  點這裡播放影片"], "notes": "時間：65–70 分鐘，影片約 3 分鐘。\n播放前問：主角一開始有沒有注意別人？\n播放後問：第一次幫助別人後，他的表情有什麼改變？\n\n[Sources]\nhttps://www.youtube.com/watch?v=qLGNj-xrgvY\nhttps://i.ytimg.com/vi/qLGNj-xrgvY/hqdefault.jpg\n[/Sources]", "links": ["https://i.ytimg.com/vi/qLGNj-xrgvY/hqdefault.jpg", "https://www.youtube.com/watch?v=qLGNj-xrgvY"]}, {"page": 9, "title": "今天，我可以幫別人一件小事", "text": ["9", "今天，我可以幫別人一件小事", "幫忙扶門", "讓後面的人方便通過。", "幫忙撿東西", "先問一聲，再伸出手。", "把物品傳過去", "一起完成工作。", "提醒朋友休息", "關心別人，也照顧自己。"], "notes": "時間：70–80 分鐘。\n請大家用動作演出扶門、撿東西、傳物品與提醒休息。\n收尾：幫忙不用做很大的事情，一個小動作就可以。\n\n[Sources]\nhttps://www.youtube.com/watch?v=qLGNj-xrgvY\n[/Sources]", "links": ["https://www.youtube.com/watch?v=qLGNj-xrgvY"]}, {"page": 10, "title": "每個人都能用自己的方法", "text": ["10", "每個人都能用自己的方法", "影片｜The Present", "每個人都有方便與不方便的事。\n重點不是一樣，而是找到方法。", "▶  點這裡播放影片"], "notes": "時間：80–85 分鐘，影片約 4 分鐘。\n敏感帶領提醒：不要說「身心障礙也能成功」或要求參與者分享自己的障礙。\n建議說法：每個人都有比較方便和比較不方便的事情，可以用自己的方法，也可以請別人幫忙。\n若教保員認為影片不適合當天成員，可跳過並直接進入下一張。\n\n[Sources]\nhttps://www.youtube.com/watch?v=C_nJJHaNmnY\nhttps://i.ytimg.com/vi/C_nJJHaNmnY/hqdefault.jpg\n[/Sources]", "links": ["https://i.ytimg.com/vi/C_nJJHaNmnY/hqdefault.jpg", "https://www.youtube.com/watch?v=C_nJJHaNmnY"]}, {"page": 11, "title": "遇到困難，我有三個選擇", "text": ["11", "遇到困難，我有三個選擇", "再試一次", "先休息一下，慢慢再來。", "換個方法", "不一定只能用同一種方法。", "請人幫忙", "求助不是失敗，是照顧自己。", "換個方向", "自己試試", "一起完成"], "notes": "時間：85–95 分鐘。\n用一個現場例子：瓶蓋打不開時，可以再試、換工具，或請旁邊的人幫忙。\n請大家用手勢選一個方法，不要求口頭回答。\n\n[Sources]\nhttps://www.youtube.com/watch?v=C_nJJHaNmnY\n[/Sources]", "links": ["https://www.youtube.com/watch?v=C_nJJHaNmnY"]}, {"page": 12, "title": "喜歡一件事，讓生活有期待", "text": ["12", "喜歡一件事，讓生活有期待", "影片｜Coin Operated", "一個想去太空的夢，\n陪著男孩走過很多年。", "▶  點這裡播放影片"], "notes": "時間：95–100 分鐘，影片約 5 分鐘。\n這支是彈性影片；若前面聊天較熱烈，可以省略，不必趕進度。\n播放前問：男孩最想去哪裡？播放後問：他做了什麼，讓夢想一直留在生活裡？\n\n[Sources]\nhttps://www.youtube.com/watch?v=5L4DQfVIcdg\nhttps://i.ytimg.com/vi/5L4DQfVIcdg/hqdefault.jpg\n[/Sources]", "links": ["https://i.ytimg.com/vi/5L4DQfVIcdg/hqdefault.jpg", "https://www.youtube.com/watch?v=5L4DQfVIcdg"]}, {"page": 13, "title": "生活裡，有哪些事情讓你期待？", "text": ["13", "生活裡，有哪些事情讓你期待？", "喜歡做的事", "唱歌、畫畫、散步、工作。", "喜歡的人", "家人、朋友、老師。", "喜歡的地方", "家裡、公園、小作所。", "明天的期待", "想做哪一件小事情？"], "notes": "時間：100–110 分鐘。\n讓大家選一格回答；可以指、舉手、說一個詞，或請工作人員協助表達。\n不要追問私人或讓人不舒服的內容。\n\n[Sources]\nhttps://www.youtube.com/watch?v=5L4DQfVIcdg\n[/Sources]", "links": ["https://www.youtube.com/watch?v=5L4DQfVIcdg"]}, {"page": 14, "title": "明天，我想做好一件小事", "text": ["14", "明天，我想做好一件小事", "照顧自己\n刷牙、喝水、收好東西", "讓人開心\n幫忙、說謝謝、微笑", "試一件事\n慢慢做，不會就請人幫忙"], "notes": "時間：110–118 分鐘。\n請每個人選一件明天願意做的小事；不一定要說完整句子。\n帶領句：不是一次把所有事情做好，只要選一件小事就可以。", "links": []}, {"page": 15, "title": "一起為自己\n拍拍手！", "text": ["一起為自己\n拍拍手！", "照顧自己", "喜歡生活", "需要時勇敢求助", "今天的最後一句話"], "notes": "時間：118–120 分鐘。\n結尾可以說：我們不用跟別人完全一樣。每天照顧自己、做一件喜歡的事，遇到困難願意找方法，就是很棒的生活。\n邀請大家一起拍手，明確宣布活動結束。", "links": []}]</script><script src="deck.js"></script></body></html>
