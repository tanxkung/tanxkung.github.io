<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>教師登入｜龔鴻裕教學與教材</title>
  <style>
    :root {
      --navy: #103451;
      --navy-deep: #09263f;
      --paper: #f3f6f8;
      --ink: #10283e;
      --muted: #5e7182;
      --gold: #f4b827;
      --line: #d8e0e7;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 20%, rgba(244,184,39,.16), transparent 26rem),
        linear-gradient(145deg, var(--navy-deep), var(--navy));
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    .login-card {
      width: min(100%, 460px);
      padding: clamp(28px, 6vw, 44px);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 24px;
      background: rgba(255,255,255,.97);
      box-shadow: 0 28px 80px rgba(0,0,0,.28);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #9a6c00;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
    }
    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    .intro {
      margin: 16px 0 26px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.75;
    }
    label {
      display: block;
      margin-bottom: 9px;
      font-size: 15px;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(244,184,39,.18); }
    button {
      width: 100%;
      min-height: 52px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--gold);
      color: #10283e;
      font: 800 17px/1 system-ui, -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      cursor: pointer;
    }
    button:hover { filter: brightness(.97); }
    button:disabled, input:disabled { cursor: not-allowed; opacity: .58; }
    #login-status {
      min-height: 24px;
      margin: 14px 0 0;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.6;
    }
    #login-status[data-type="error"] { color: #b42318; }
    #login-status[data-type="success"] { color: #067647; }
    #login-status[data-type="warning"] { color: #925f00; }
    .shared-computer {
      margin: 22px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <p class="eyebrow">TEACHING MATERIALS</p>
    <h1>教師登入</h1>
    <p class="intro">請輸入門禁密碼，驗證後即可開啟龔鴻裕老師的課程教材。</p>
    <form id="login-form" novalidate>
      <label for="site-password">門禁密碼</label>
      <input id="site-password" name="site-passphrase" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus>
      <button id="login-submit" type="submit">開啟教材</button>
      <p id="login-status" role="status" aria-live="polite"></p>
    </form>
    <p class="shared-computer">使用學校共用電腦時，建議開啟無痕視窗。下課後請按「登出」，並關閉瀏覽器視窗。</p>
  </main>
  <script src="access-gate-config.js?v=14b"></script>
  <script src="access-login.js?v=14b"></script>
</body>
</html>
