art"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">什麼是</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">「</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">生涯</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">」</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">什麼是</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">「</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">職涯</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">」</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">職涯探索</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">4</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">構面</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">人格</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">/</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">性格</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">興趣</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">能力</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">需求與價值觀</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">總結</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-3" data-title="什麼是「生涯」" aria-label="第 3 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">什麼是「生涯」</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">?</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">  1.</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">生涯是指一個人在一生中所扮演的角色的綜合及結果。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.5;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">  2.</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">這些角色包括兒女、學生、休閒者、公民、工作者、配偶、家管人員、父母及退休者等九項，而九個角色在四個主要場所：家庭、社區、學校及工作場所中扮演。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.5;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">  </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">3.</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">一個人在一生中所扮演許許多多的角色，就如同一條彩虹同時具有許多色帶。 </span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-4" data-title="什麼是「生涯」" aria-label="第 4 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">什麼是「生涯」</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">?</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g><g transform="translate(239.1431496062992,228.8579527559055)"><svg width="1399.3952755905511" height="839.1420472440944" overflow="hidden"><image href="assets/36041562df683b996041.png" x="-0.0" y="-0.0" width="1399.3952755905511" height="839.1420472440944" preserveAspectRatio="none"/></svg></g></svg></section><section class="slide" id="slide-5" data-title="什麼是「生涯」" aria-label="第 5 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">什麼是「生涯」</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">?</span></p></div></div></foreignObject></g><g transform="translate(1346.9814173228347,231.42866141732281)"><svg width="406.7795275590551" height="720.0" overflow="hidden"><image href="assets/5b8beebc7a2e1fc04213.jpg" x="-0.0" y="-0.0" width="406.7795275590551" height="720.0" preserveAspectRatio="none"/></svg></g><g transform="translate(174.0,231.42866141732281)"><svg width="1069.7436220472441" height="720.0" overflow="hidden"><image href="assets/2b82f6097789540eb54e.png" x="-0.0" y="-0.0" width="1069.7436220472441" height="720.0" preserveAspectRatio="none"/></svg></g></svg></section><section class="slide" id="slide-6" data-title="來看看這個人的故事" aria-label="第 6 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">來看看這個人的故事</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">…</span></p></div></div></foreignObject></g><g transform="translate(173.99984251968502,252.0)"><rect width="1611.1428346456692" height="761.7143307086614" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1611.1428346456692" height="761.7143307086614"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">1890</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">年出生在偏鄉的一個小農場。父親在他</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">5</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲時去世，母親靠打零工含辛茹苦撫養三個孩子，生為家中老大，所以要幫助照顧弟弟妹妹</span></p><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">12</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲時，母親改嫁，繼父的關係很差，兩人經常打架。學習成績也很差，尤其是數學</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">代數</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">讓他絕望，所以他只上到小學六年級就輟了學，開始四處打零工為生</span></p><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">19</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲時，他結了第一次婚，有了三個孩子，不久妻子因為家庭過於貧窮而離婚，一個兒子也病死了，他一度患上了憂鬱症</span></p><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">12~40</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲的</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">28</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">年裡，做過的工作有：農場小工、保險推銷員、燈具和輪胎推銷員、輪渡小老闆、臨時消防員，甚至助產士，還曾在陸軍短暫服役，一事無成</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">…</span></p><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">40</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲時，殼牌石油公司提供了一個位於肯塔基州北科爾賓的小加油站，位於高速公路邊。為了多掙點錢，開始向飢餓的旅行者出售飯菜。出乎意料的是，口味獲得了一致讚許，很多人慕名來到加油站，不是為了加油而是吃炸雞。於是開了人生第一家餐廳，看起來開始要順利了。然而，一條新開的高速公路繞開了這家餐廳，從此生意慘淡。被迫廉價賣掉餐廳，靠拍賣收入和微薄的社會救濟維生</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">…</span></p><p style="font-size:33.600px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">此時，他已經</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">65</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">歲了</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">….</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">人生怎麼走下去呢</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">? </span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">說好的生涯呢</span><span style="font-size:36.400px;color:#102b46;font-weight:400;font-style:normal">? </span></p><p style="font-size:33.600px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-7" data-title="「生涯」概念的重要特質" aria-label="第 7 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">「生涯」概念的重要特質 </span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">終生性：一個人一生所擁有的職位、角色。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">總合性：一生中所有的職位、角色的總合。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">企求性：生涯不僅需適合個人的特質，同時也是個人企求的。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">工作性：個人的生涯是以工作為中心，「職涯」的重要性。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">發展性：成長歷程中職業概念逐漸形成，最後以職業觀念與自我觀念配合，達成最後的職業選擇並繼續發展。 </span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-8" data-title="你選擇哪種生涯模式" aria-label="第 8 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">你選擇哪種生涯模式</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">? </span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">一本藍圖走到底：生涯的方向只有一個單純的目標，向上爬升</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">騎驢兒看唱本：邊走邊瞧，不害怕新的嘗試，隨時準備面對新的學習與挑戰，修改生涯方向</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">即興演出：不知道要什麼，但清楚知道不要什麼，一路選擇，去除不喜歡的，生涯方向逐漸明確清晰</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">腳踏兩條船：工作只是謀生安定的工具，他的「生涯」，則跟嗜好結合，放在第二副業裡。 </span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">以上都很好，無關價值判斷</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">個人生涯模式的抉擇會受到其成長背景中的社會文化、家庭、重要經驗等因素影響。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">每個人都需要面對為自己生命的過程摸索、定位，別人無權判斷對錯。</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">更重要的是，生涯的追尋，是沒有終點的</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-9" data-title="什麼是「職涯」" aria-label="第 9 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">什麼是「職涯」</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">?</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">職涯</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">=</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">職業生涯，就是個人在從事各種任務或工作時之職位與角色的總和</span></p></div></div></foreignObject></g><g transform="translate(713.9743307086613,318.8571653543307)"><svg width="1089.6930708661416" height="738.8571653543306" overflow="hidden"><image href="assets/cf0592a49fbe9e0c00a8.png" x="-0.0" y="-0.0" width="1089.6930708661416" height="738.8571653543306" preserveAspectRatio="none"/></svg></g></svg></section><section class="slide" id="slide-10" data-title="「職涯」如何探索與規劃" aria-label="第 10 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">「職涯」如何探索與規劃</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g><g transform="translate(251.55102362204724,252.0)"><svg width="1394.0407874015748" height="602.9322834645669" overflow="hidden"><image href="assets/2aa99333babd1262095b.png" x="-0.0" y="-0.0" width="1394.0407874015748" height="602.9322834645669" preserveAspectRatio="none"/></svg></g></svg></section><section class="slide" id="slide-11" data-title="職涯四構面" aria-label="第 11 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">職涯四構面</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">內圈，主觀，個人決定</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">外圈，客觀，蒐集資訊</span></p><p style="font-size:48.0 nsform="translate(888.4015748031495,245.7143307086614)"><rect width="65.43275590551181" height="58.16251968503937" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="65.43275590551181" height="58.16251968503937"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">快</span></p></div></div></foreignObject></g><g transform="translate(888.4015748031495,981.7141732283465)"><rect width="104.74125984251968" height="58.16251968503937" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="104.74125984251968" height="58.16251968503937"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">慢</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-13" data-title="人格特質分析系統" aria-label="第 13 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">人格特質分析系統</span><br><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">（</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Professional </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Dynametric</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal"> Programs</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">，簡稱</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">PDP</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">）</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:36.000px;color:#102b46;font-weight:400;font-style:normal">孔雀 </span><span style="font-size:36.000px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:36.000px;color:#102b46;font-weight:400;font-style:normal">影響型</span><span style="font-size:36.000px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:36.000px;color:#102b46;font-weight:400;font-style:normal">：外向 多言 樂觀</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">特點：一群人裡面說話最多的 天生希望成為注意力的中心，具有很強的好奇心 熱情 熱心具有表達能力 精力充沛 具有幹勁（但是卻缺乏毅力 所以常常這幹幹 那乾幹） 好表現 粗線條 輕許諾（因為熱心所以常常答應別人 但是由於記憶差，所以常常答應後就忘記了） 以自己的快樂為主</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">缺點：以自己為中心 獨霸主題 愛打斷別人的談話 不注意記憶 變化無常 這類人易交朋友 但深切的朋友卻不多 喜好多卻不精 缺乏毅力</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">切入點：如果跟這類型的人交往 一定要多誇獎他 多鼓勵他 多給他說話的機會</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">自我規劃：</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">1</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、管住自己的嘴</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">2</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、控制自己的表現慾望</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">3</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、對自己的評價不要過高 關心自己的同時也要關心別人</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">4</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、培養記憶力</span></p><p style="font-size:19.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">5</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">，不要太善變，要腳踏實地 要做就要把一件事作完整</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-14" data-title="人格特質分析系統" aria-label="第 14 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">人格特質分析系統</span><br><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">（</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Professional </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Dynametric</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal"> Programs</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">，簡稱</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">PDP</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">）</span></p></div></div></foreignObject></g><g transform="translate(164.8571653543307,261.14283464566927)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">老虎 </span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">支配型</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">) : </span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">外向 行動者 樂觀</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">特點：喜歡做主 行動力強 行動速度 思考力稍弱 喜歡做目標 不達目的不罷休 充滿自信 意志堅定 有活力 做事主動 不易氣餒 是推動別人行動的人 粗線條 不容易適應環境 （不過由於行動力很強 所以往往做事會有很大成就 ）</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">缺點：不易看到別人的需求，只看到自己的需求 做錯事後很容易原諒自己 固執 易爭吵 好鬥 說話極易傷害別人 具有強迫性 很容易支配別人 無耐性 專橫 經常人際關係差 （這類人總覺得自己是對的 不太需要朋友，並且這類人天生行動力強，但是即使是正確的事情 也因為性格問題 說話傷害到別人 而得不到別人的支持和認同）</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">注意點：這類型嚴重者會很獨斷 霸道 容易讓別人感到壓力 相處很累</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">自我規劃：</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">1</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">、減輕對別人的壓力 學會放鬆 要緩和</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">2</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">、嘗試接受別人的號召和意見 嘗試耐心和低調</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">3</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">、停止爭吵讓別人也感覺到放鬆</span></p><p style="font-size:37.200px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">4</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">、學習包容 學會道歉 學會坦然接受自己的錯誤 放開胸懷（當一個老虎學會承認錯誤 那麼他便成功了</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-15" data-title="人格特質分析系統" aria-label="第 15 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">人格特質分析系統</span><br><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">（</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Professional </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Dynametric</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal"> Programs</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">，簡稱</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">PDP</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">）</span></p></div></div></foreignObject></g><g transform="translate(164.85700787401575,261.1426771653543)"><rect width="1635.1428346456692" height="776.5714960629921" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1635.1428346456692" height="776.5714960629921"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">貓頭鷹 </span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">分析型</span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">：內向 思考者 對事物看法較為負面</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">特點：以思考為主 深思熟慮 嚴肅 有目標 並且目標感很強 追求完美 有藝術天分 沉悶 關注細節 完美主義 高標準 想得多但做得少 做事前一定要先想個計劃 有條理 有組織 交友慎重（但一旦交往 就會很忠誠的對待朋友） 關心別人</span><br><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">為別人犧牲是自己的意願 （所以這類型的人一生一定有幾個特別好的朋友</span><br><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">一輩子的朋友那種）情感豐富容易感動 也容易受傷 高標準</span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">–</span><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">對自己要求高對​​別人要求也高 希望一切都作的很好 很對 、理想主義 朝著自己的目標前進</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">缺點：行動力弱 優柔寡斷 容易抑鬱（常常是因為要求過高了 當達不到時候就會很失望）容易自慚自愧 悲觀 天生消極 易受環境影響 情緒化 注意點：這類型的人太容易思考 過分時會情緒低落</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">切入點：如果想和著類型的人合作 一定要先打動他 但是不要急功近利 要一點一點的建立信任和感情 這類型的人 一旦認同你後 會很忠誠 忠心</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:32.500px;color:#102b46;font-weight:400;font-style:normal">自我規劃：</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">1</span><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">、要快樂起來（沒人喜歡鬱悶的人）</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">2</span><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">、不要太容易受傷害 不要太敏感</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">3</span><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">、 不要把時間都用來規劃上面 而不去行動發</span></p><p style="font-size:30.000px;text-align:left;line-height:1.2;margin:0 0 0.000px"><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">4</span><span style="font-size:23.750px;color:#102b46;font-weight:400;font-style:normal">，不要那麼高標準的要求別人 他不是你 要放鬆下來 要去發現別人的優點</span></p><p style="font-size:30.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-16" data-title="人格特質分析系統" aria-label="第 16 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">人格特質分析系統</span><br><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">（</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Professional </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">Dynametric</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal"> Programs</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">，簡稱</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">PDP</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">）</span></p></div></div></foreignObject></g><g transform="translate(164.8571653543307,261.14283464566927)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">無尾熊</span><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">穩健型</span><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">：內向 執行者 追隨者</span></p><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">特點：性格低調 易相處 很輕鬆 平和 無異議 耐心 適應力強 無攻擊性 很好的聆聽者 人際關係好（和事老） 所以朋友很多 不愛生氣，一但答應下的工作會默默做完</span></p><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">缺點：不容易興奮 拒絕改變 喜歡一成不變 目標感不強 看似懶惰 不願承擔責任 迴避壓力 沉默、馬虎 無主見（需要力量型的人 給於指導，但不要施加壓力） 不善於做決定</span></p><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">切入點：和這類型的人交往 一定要鼓勵他 促進他</span></p><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">注意點：這類型過分時會毫無主見 做事漫不經心</span></p><p style="font-size:48.000px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:32.000px;color:#102b46;font-weight:400;font-style:normal">自我規劃：</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">1</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、讓自己快樂起來 給自己嘗試新鮮的事物和思想</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">2</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、明確生活的責任 不要得過且過</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">3</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、有意識接受督促（找隻老虎或貓頭鷹做朋友吧）</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">4</span><span style="font-size:24.000px;color:#102b46;font-weight:400;font-style:normal">、多表達 溝通</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-17" data-title="生產力" aria-label="第 17 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">能力</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">? </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">生產力</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">? </span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">就是妳</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">/</span><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal">你的價值</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><g transform="translate(0.9075590551181102,233.9251968503937)"><ellipse cx="126.07464566929133" cy="126.07464566929133" rx="126.07464566929133" ry="126.07464566929133" fill="rgba(81,72,67,1)" stroke="rgba(255,255,255,1)" stroke-width="7.559055118110236"/><foreignObject width="252.14929133858266" height="252.14929133858266"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:4.2px 4.2px 4.2px 4.2px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px"><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">勞動力</span></p></div></div></foreignObject></g><g transform="translate(273.5314960629921,286.87653543307084)"><path d="M55.57371338582677,0 H90.67290078740157 V55.57371338582677 H146.24661417322835 V90.67290078740157 H90.67290078740157 V146.24661417322835 H55.57371338582677 V90.67290078740157 H0 V55.57371338582677 H55.57371338582677 Z" fill="rgba(185,182,180,1)" stroke="none" stroke-width="2.0"/><foreignObject width="146.24661417322835" height="146.24661417322835"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:0.0px 0.0px 0.0px 0.0px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g><g transform="translate(440.2525984251968,233.9251968503937)"><ellipse cx="126.07464566929133" cy="126.07464566929133" rx="126.07464566929133" ry="126.07464566929133" fill="rgba(81,72,67,1)" stroke="rgba(255,255,255,1)" stroke-width="7.559055118110236"/><foreignObject width="252.14929133858266" height="252.14929133858266"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:4.2px 4.2px 4.2px 4.2px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px"><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">知識、技術與經驗</span></p></div></div></foreignObject></g><g transform="translate(712.8765354330708,286.87653543307084)"><path d="M55.57371338582677,0 H90.67290078740157 V55.57371338582677 H146.24661417322835 V90.67290078740157 H90.67290078740157 V146.24661417322835 H55.57371338582677 V90.67290078740157 H0 V55.57371338582677 H55.57371338582677 Z" fill="rgba(185,182,180,1)" stroke="none" stroke-width="2.0"/><foreignObject width="146.24661417322835" height="146.24661417322835"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:0.0px 0.0px 0.0px 0.0px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g><g transform="translate(879.5977952755906,233.9251968503937)"><ellipse cx="126.07464566929133" cy="126.07464566929133" rx="126.07464566929133" ry="126.07464566929133" fill="rgba(81,72,67,1)" stroke="rgba(255,255,255,1)" stroke-width="7.559055118110236"/><foreignObject width="252.14929133858266" height="252.14929133858266"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:4.2px 4.2px 4.2px 4.2px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px"><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">資本</span><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">(</span><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">有形、無形</span><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">)</span></p></div></div></foreignObject></g><g transform="translate(1152.2217322834645,286.87653543307084)"><rect x="0" y="36.56165354330709" width="146.24661417322835" height="26.324390551181104" fill="rgba(185,182,180,1)" stroke="none" stroke-width="2.0"/><rect x="0" y="83.36057007874015" width="146.24661417322835" height="26.324390551181104" fill="rgba(185,182,180,1)" stroke="none" stroke-width="2.0"/><foreignObject width="146.24661417322835" height="146.24661417322835"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:0.0px 0.0px 0.0px 0.0px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g><g transform="translate(1318.9429921259841,233.9251968503937)"><ellipse cx="126.07464566929133" cy="126.07464566929133" rx="126.07464566929133" ry="126.07464566929133" fill="rgba(81,72,67,1)" stroke="rgba(255,255,255,1)" stroke-width="7.559055118110236"/><foreignObject width="252.14929133858266" height="252.14929133858266"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:4.2px 4.2px 4.2px 4.2px;justify-content:center"><div class="text-fit"><p style="font-size:48.000px;text-align:center;line-height:0.9;margin:0 0 0.000px"><span style="font-size:42.000px;color:#ffffff;font-weight:400;font-style:normal">生產力</span></p></div></div></foreignObject></g></g><g transform="translate(193.14283464566927,750.8570078740157)"><rect width="239.11244094488188" height="232.65007874015748" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="239.11244094488188" height="232.65007874015748"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">青春的肉體</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">長得美</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">帥</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">)</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">身材好</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">壯</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">)</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">體能好</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">肢體協調</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">…</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">等</span></p></div></div></foreignObject></g><g transform="translate(590.8577952755905,750.8570078740157)"><rect width="375.76409448818896" height="145.4062992125984" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="375.76409448818896" height="145.4062992125984"><div xmlns="http://www.w3.org/1 b46;font-weight:400;font-style:normal">, </span><br><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">包含動產、不動產</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">無形的資本</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">=</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">智慧財產權</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">專利、著作、營業祕密</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">)</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">社會資本 </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">= </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">關係</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-18" data-title="生產力的正向" aria-label="第 18 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.0,12.0)"><rect width="1571.7609448818896" height="172.74992125984252" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1571.7609448818896" height="172.74992125984252"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:#102b46;font-weight:400;font-style:normal"> le="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">消費</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">, </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">避免過渡的消費是第一課</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">儲蓄的目的</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">, </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">不應該是作大額的消費</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">, </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">而應該思考：</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">消極的意義是未雨綢繆</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">積極的意思是提高自己的生產力</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">以投資提高生產力</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">, </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">要思考資源的效率性</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">初期</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">(30</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">歲以前</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">：投資在</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">”</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">知識</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">/</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">技術</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">/</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">經驗</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">” &gt; </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">投資在</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">”</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">資本</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">” &gt; </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">投資在 </span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">“</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">勞動力</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">”</span></p><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">中期</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">(30~50</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">歲</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:48.000px;color:#102b46;font-weight:400;font-style:normal">：投資在</span>< ><p style="font-size:48.000px;text-align:center;line-height:1.05;margin:0 0 0.000px"><span style="font-size:64.000px;color:#102b46;font-weight:700;font-style:normal">伴侶與家人</span></p></div></div></foreignObject></g><g transform="translate(751.0,868.7502362204724)"><rect width="413.0" height="91.24992125984251" rx="0" fill="rgba(102,255,51,1)" stroke="none" stroke-width="2.0"/><foreignObject width="413.0" height="91.24992125984251"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:48.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:64.000px;color:#102b46;font-weight:700;font-style:normal">職業生涯目標</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-23" data-title="為何難許下未來，生涯阻礙類型" aria-label="第 23 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(171.6431496062992,84.92866141732283)"><rect width="1260.0" height="102.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1260.0" height="102.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:72.000px;color:rgba(153,51,255,1);font-weight:400;font-style:normal">為何難許下未來，生涯阻礙類型</span><span style="font-size:72.000px;color:rgba(153,51,255,1);font-weight:400;font-style:normal">—</span><span style="font-size:88.000px;color:rgba(153,51,255,1);font-weight:700;font-style:normal"> </span></p></div></div></foreignObject></g><g transform="translate(329.2502362204724,276.0)"><rect width="1288.5" height="638.2500787401575" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1288.5" height="638.2500787401575"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">意志薄弱型：</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">親朋好友對某工作的評語會影響我的生涯</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">               選擇。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">猶豫不決型：</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">因為擔心自己的能力或是信心不足，而對</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">               自己期望發展的方向不敢採取行動。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">資訊不足型：</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">因為不了解整個就業或社會環境，所以無</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">               法為未來的發展做出選擇或準備。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">特質表現型：</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">我是個比較被動、較缺乏主見的人，所以</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">               遲遲未能去探索自己可能的生涯發展。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-24" data-title="方向選擇型：" aria-label="第 24 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(329.2502362204724,276.0)"><rect width="1288.5" height="672.2500787401574" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1288.5" height="672.2500787401574"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:700;font-style:normal">方向選擇型：</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">對自己未來的發展方向感到模糊，所以無</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">               法明確地規劃和積極努力。</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:700;font-style:normal">科系選擇型：</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">目前所就讀的科系與自己當初的期待不太</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">               符合。</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:700;font-style:normal">學習狀況型：</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">我對大學所學感到失望（如：感覺沒學到</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">               什麼專業能力、課業壓力太重、只是為了</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">               文憑</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">……</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">等）。</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:700;font-style:normal">生活困擾型：</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">受到人際關係、感情問題</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">……</span><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">等困擾，使</span></p><p style="font-size:37.200px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:37.200px;color:#102b46;font-weight:400;font-style:normal">               我無法好好思考、探索自己未來的生涯。 </span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-25" data-title="發現自己生涯阻礙，找出對策" aria-label="第 25 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(165.9288188976378,84.92866141732283)"><rect width="1260.0" height="102.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1260.0" height="102.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:88.000px;text-align:left;line-height:1.05;margin:0 0 0.000px"><span style="font-size:88.000px;color:rgba(153,51,255,1);font-weight:700;font-style:normal">發現自己生涯阻礙，找出對策</span><span style="font-size:88.000px;color:rgba(153,51,255,1);font-weight:700;font-style:normal">-</span></p></div></div></foreignObject></g><g transform="translate(174.0,252.0)"><rect width="1572.0" height="720.0" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1572.0" height="720.0"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">意志不弱型：</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">    可思考，我的理想是什麼？我的生涯目標是否投射了他人的期待？適合發展的方向在那裡？哪些因素影響我做決定？我該堅持哪些部份？</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">猶豫行動型</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">：</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">    如能先找出自己無法跨出的原因，對自己建立信心，提起勇氣實際行動，或利用一些技術</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">(</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">行為改變、獎賞等</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">)</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">來督促自己採取行動，那麼可以改善這樣現象。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">資訊探索型</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">：</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">    多從師長、朋友等人中尋求獲得資訊的管道，或積極收集相關資訊（人力銀行等），抱持隨時吸收資訊的態度，累積自己生涯發展的本錢，如此才能擁有豐富的資訊，有效率地進行生涯探索。</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:700;font-style:normal">特質表現型</span><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">：</span></p><p style="font-size:40.800px;text-align:left;line-height:1.1;margin:0 0 0.000px"><span style="font-size:40.800px;color:#102b46;font-weight:400;font-style:normal">    如果能靜下來察覺一下，自己是不是有不利於發展探索的特質，並且努力去調整，那麼就有機會改變目前的這種狀態。</span></p></div></div></foreignObject></g></svg></section><section class="slide" id="slide-26" data-title="方向選擇型：" aria-label="第 26 頁"><svg class="source-canvas" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff"><g transform="translate(174.25023622047243,239.2499212598425)"><rect width="1565.1782677165354" height="780.1784251968504" rx="0" fill="none" stroke="none" stroke-width="2.0"/><foreignObject width="1565.1782677165354" height="780.1784251968504"><div xmlns="http://www.w3.org/1999/xhtml" class="source-text" data-editable="true" style="padding:7.199999999999999px 14.399999999999999px 7.199999999999999px 14.399999999999999px;justify-content:flex-start"><div class="text-fit"><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">方向選擇型：</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">    </span><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">可以先花一些時間確定自己的興趣、能力、社會現況的觀察等，不要因為急著要確定方向，而限制了選擇範圍，或者做錯了選擇。</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">科系選擇型：</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">    </span><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">可透過與師長對話或心理測驗等，來了解科系是否為自己要的，若仍不確定</span><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">，</span><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">不妨先拋棄排斥的心，多撥些時間去接觸這個科系；若是確定無興趣，或許可嚐試轉系、轉學、甚至休學重考。若你已是高年級同學則可利用課餘時間做些課外的準備。</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">學習狀況型： ：</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">    </span><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">如果個人對自己的學習狀況不滿意，連帶影響自己在未來發展的準備。或許需要察覺這樣的原因是什麼（如得不到成就感等），而讓自己在認知與行動上做一些調整，能有助於自己投入生涯發展之中。</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:700;font-style:normal">生活困擾型：</span></p><p style="font-size:44.400px;text-align:left;line-height:1.0;margin:0 0 0.000px"><span style="font-size:33.300px;color:#102b46;font-weight:400;font-style:normal">    了解影響自己的生活困擾來源，或嘗試調整自己的生活習慣（如時間管理等），避免錯過適當的學習時機，錯失使自己生涯達到更好狀態的機會。</span></p><p style="font-size:44.400px;text-align:left;line-height:0.8;margin:0 0 0.000px">&#8203;</p></div></div></foreignObject></g></svg></section></div></main>

的這種狀態。"], "notes": "", "links": []}, {"page": 26, "title": "方向選擇型：", "text": ["方向選擇型：", "    ", "可以先花一些時間確定自己的興趣、能力、社會現況的觀察等，不要因為急著要確定方向，而限制了選擇範圍，或者做錯了選擇。", "科系選擇型：", "    ", "可透過與師長對話或心理測驗等，來了解科系是否為自己要的，若仍不確定", "，", "不妨先拋棄排斥的心，多撥些時間去接觸這個科系；若是確定無興趣，或許可嚐試轉系、轉學、甚至休學重考。若你已是高年級同學則可利用課餘時間做些課外的準備。", "學習狀況型： ：", "    ", "如果個人對自己的學習狀況不滿意，連帶影響自己在未來發展的準備。或許需要察覺這樣的原因是什麼（如得不到成就感等），而讓自己在認知與行動上做一些調整，能有助於自己投入生涯發展之中。", "生活困擾型：", "    了解影響自己的生活困擾來源，或嘗試調整自己的生活習慣（如時間管理等），避免錯過適當的學習時機，錯失使自己生涯達到更好狀態的機會。"], "notes": "", "links": []}]</script><script src="deck.js"></script></body></html>
